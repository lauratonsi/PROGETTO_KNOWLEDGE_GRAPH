<?xml version="1.0" encoding="UTF-8"?>
<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="35%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#162040"/>
      <stop offset="100%" stop-color="#09111e"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- ── Sfondo ── -->
  <rect width="1280" height="640" fill="url(#bg)"/>

  <!-- Linea divisoria centrale (tratteggiata, sottile) -->
  <line x1="640" y1="30" x2="640" y2="610"
        stroke="#ffffff0a" stroke-width="1.5" stroke-dasharray="6,8"/>

  <!-- ══════════════════════════════════
       SINISTRA — Knowledge Graph
  ══════════════════════════════════ -->

  <!-- Silhouette ottagonale di Bologna (mura storiche, sfondo) -->
  <polygon
    points="510,280 451,462 310,480 169,462 110,280 169,98 310,80 451,98"
    fill="none" stroke="#ffffff07" stroke-width="50" opacity="0.6"/>
  <polygon
    points="510,280 451,462 310,480 169,462 110,280 169,98 310,80 451,98"
    fill="#ffffff02" stroke="#ffffff0d" stroke-width="1.5"/>

  <!-- ── Archi del grafo ── -->
  <!-- Arco principale: StreetToponym → isDedicatedTo → Person -->
  <line x1="222" y1="267" x2="305" y2="263"
        stroke="#4a6fa5" stroke-width="2.5" opacity="0.9"/>
  <line x1="341" y1="261" x2="418" y2="265"
        stroke="#4a6fa5" stroke-width="2.5" opacity="0.9"/>

  <!-- Proprietà di StreetToponym -->
  <line x1="163" y1="252" x2="108" y2="165" stroke="#ffffff18" stroke-width="1.2"/>
  <line x1="167" y1="271" x2="90"  y2="292" stroke="#ffffff15" stroke-width="1.2"/>
  <line x1="170" y1="294" x2="112" y2="392" stroke="#ffffff14" stroke-width="1.2"/>
  <line x1="188" y1="305" x2="174" y2="445" stroke="#ffffff12" stroke-width="1.2"/>
  <line x1="204" y1="247" x2="272" y2="153" stroke="#ffffff15" stroke-width="1.2"/>

  <!-- Proprietà di Person -->
  <line x1="492" y1="257" x2="546" y2="160" stroke="#ffffff18" stroke-width="1.2"/>
  <line x1="500" y1="274" x2="558" y2="276" stroke="#c45c8245" stroke-width="2"/>
  <line x1="494" y1="293" x2="547" y2="392" stroke="#ffffff14" stroke-width="1.2"/>
  <line x1="474" y1="311" x2="442" y2="452" stroke="#ffffff12" stroke-width="1.2"/>
  <line x1="455" y1="310" x2="362" y2="457" stroke="#ffffff12" stroke-width="1.2"/>

  <!-- ── Nodi proprietà (piccoli, grigio-blu) ── -->
  <circle cx="108" cy="164" r="10" fill="#2d4566" opacity="0.9"/>
  <text x="108" y="150" text-anchor="middle" font-size="8.5" fill="#7aaace"
        font-family="monospace">officialStreetName</text>

  <circle cx="88" cy="292" r="10" fill="#2d4566" opacity="0.9"/>
  <text x="65"  y="289" text-anchor="end" font-size="8.5" fill="#7aaace"
        font-family="monospace">quartiere</text>

  <circle cx="110" cy="393" r="10" fill="#2d4566" opacity="0.9"/>
  <text x="86"  y="390" text-anchor="end" font-size="8.5" fill="#7aaace"
        font-family="monospace">geoPoint</text>

  <circle cx="173" cy="447" r="10" fill="#2d4566" opacity="0.9"/>
  <text x="173" y="467" text-anchor="middle" font-size="8.5" fill="#7aaace"
        font-family="monospace">dataIstituzione</text>

  <circle cx="273" cy="151" r="10" fill="#2d4566" opacity="0.9"/>
  <text x="273" y="139" text-anchor="middle" font-size="8.5" fill="#7aaace"
        font-family="monospace">tipologiaLuogo</text>

  <circle cx="548" cy="158" r="10" fill="#2d4566" opacity="0.9"/>
  <text x="548" y="145" text-anchor="middle" font-size="8.5" fill="#c090b0"
        font-family="monospace">fullName</text>

  <!-- hasSex (speciale: colorato) -->
  <circle cx="560" cy="278" r="15" fill="#6b1a3a" stroke="#c45c82" stroke-width="1.5"/>
  <text x="560" y="282" text-anchor="middle" font-size="8" fill="#f0b0cc"
        font-family="monospace">hasSex</text>
  <!-- sex:F e sex:M -->
  <line x1="560" y1="264" x2="588" y2="245" stroke="#c45c8250" stroke-width="1"/>
  <line x1="560" y1="292" x2="588" y2="313" stroke="#1b5a9b50" stroke-width="1"/>
  <circle cx="592" cy="241" r="9" fill="#c45c82" opacity="0.85"/>
  <text x="607" y="238" font-size="8" fill="#f0b0cc" font-family="monospace">sex:F</text>
  <circle cx="592" cy="317" r="9" fill="#1b5a9b" opacity="0.85"/>
  <text x="607" y="321" font-size="8" fill="#8ab0e0" font-family="monospace">sex:M</text>

  <circle cx="549" cy="393" r="10" fill="#2d4566" opacity="0.9"/>
  <text x="549" y="411" text-anchor="middle" font-size="8.5" fill="#c090b0"
        font-family="monospace">professione</text>

  <circle cx="441" cy="455" r="10" fill="#2d4566" opacity="0.9"/>
  <text x="441" y="473" text-anchor="middle" font-size="8.5" fill="#c090b0"
        font-family="monospace">dataNascita</text>

  <circle cx="360" cy="459" r="10" fill="#2d4566" opacity="0.9"/>
  <text x="360" y="477" text-anchor="middle" font-size="8.5" fill="#c090b0"
        font-family="monospace">macroCat</text>

  <!-- ── Nodo isDedicatedTo (connettore) ── -->
  <circle cx="323" cy="262" r="19" fill="#1e3050" stroke="#3d6090" stroke-width="1.5"/>
  <text x="323" y="258" text-anchor="middle" font-size="6.5" fill="#90aed0"
        font-family="monospace">isDedicated</text>
  <text x="323" y="270" text-anchor="middle" font-size="6.5" fill="#90aed0"
        font-family="monospace">To</text>

  <!-- ── Nodo principale: clv:StreetToponym (blu) ── -->
  <circle cx="185" cy="267" r="40" fill="#1b3a6b" stroke="#3a6ab5"
          stroke-width="2.5" filter="url(#glow)"/>
  <text x="185" y="261" text-anchor="middle" font-size="8.5" fill="#ffffff"
        font-family="monospace" font-weight="bold">clv:</text>
  <text x="185" y="273" text-anchor="middle" font-size="8.5" fill="#a0c4ff"
        font-family="monospace">StreetToponym</text>
  <text x="185" y="284" text-anchor="middle" font-size="7.5" fill="#5a84b0"
        font-family="monospace">1.132</text>

  <!-- ── Nodo principale: cpv:Person (rosa) ── -->
  <circle cx="458" cy="271" r="40" fill="#8b1a4a" stroke="#c45c82"
          stroke-width="2.5" filter="url(#glow)"/>
  <text x="458" y="265" text-anchor="middle" font-size="8.5" fill="#ffffff"
        font-family="monospace" font-weight="bold">cpv:</text>
  <text x="458" y="277" text-anchor="middle" font-size="8.5" fill="#ffb0cc"
        font-family="monospace">Person</text>
  <text x="458" y="288" text-anchor="middle" font-size="7.5" fill="#b06080"
        font-family="monospace">1.129</text>

  <!-- ── Titolo (in basso a sinistra) ── -->
  <text x="55" y="506" font-size="46" font-weight="bold" fill="#ffffff"
        font-family="'Helvetica Neue',Arial,sans-serif" letter-spacing="-0.5">Gender Gap</text>
  <text x="55" y="553" font-size="29" fill="#c8d4e8"
        font-family="'Helvetica Neue',Arial,sans-serif">Toponomastica di Bologna</text>
  <text x="55" y="587" font-size="13" fill="#4e6e9a"
        font-family="'Helvetica Neue',Arial,sans-serif" letter-spacing="0.4">Knowledge Graph · SPARQL · LLM · Wikidata</text>
  <text x="55" y="610" font-size="11.5" fill="#374e70"
        font-family="'Helvetica Neue',Arial,sans-serif">GEPID 2024–25 · Università di Bologna</text>

  <!-- ══════════════════════════════════
       DESTRA — Percentuale + Bilancia
  ══════════════════════════════════ -->

  <!-- Percentuale (grande, prominente) -->
  <text x="940" y="158" text-anchor="middle" font-size="100" font-weight="bold"
        fill="#c45c82" font-family="'Helvetica Neue',Arial,sans-serif" opacity="0.95">5,8%</text>
  <text x="940" y="198" text-anchor="middle" font-size="14" fill="#b07090"
        font-family="'Helvetica Neue',Arial,sans-serif">delle strade intitolate a persone è dedicata a una donna</text>

  <!-- ── Bilancia ── -->

  <!-- Fulcro (triangolo + base) -->
  <polygon points="940,390 906,444 974,444" fill="#4a6070" opacity="0.88"/>
  <rect x="890" y="442" width="100" height="12" rx="5" fill="#3a5060" opacity="0.85"/>

  <!-- Asta (inclinata: lato M è più pesante → scende a sinistra) -->
  <!-- Da (758, 440) a (1122, 322); perno a (940, 381) — punto medio esatto -->
  <line x1="758" y1="440" x2="1122" y2="322"
        stroke="#7a9ab8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="940" cy="381" r="9" fill="#6a8aa8"/>

  <!-- Lato sinistro: Uomini (pesante, scende) -->
  <line x1="758" y1="440" x2="758" y2="490" stroke="#7a9ab8" stroke-width="2"/>
  <line x1="728" y1="490" x2="788" y2="490" stroke="#7a9ab8" stroke-width="2"/>
  <line x1="728" y1="490" x2="728" y2="540" stroke="#7a9ab8" stroke-width="1.5"/>
  <line x1="788" y1="490" x2="788" y2="540" stroke="#7a9ab8" stroke-width="1.5"/>
  <!-- Piatto sinistro (M) -->
  <rect x="706" y="540" width="104" height="65" rx="9"
        fill="#1b3a6b" stroke="#2a5090" stroke-width="1.5"/>
  <text x="758" y="568" text-anchor="middle" font-size="24" font-weight="bold"
        fill="#ffffff" font-family="'Helvetica Neue',Arial,sans-serif">1.066</text>
  <text x="758" y="587" text-anchor="middle" font-size="11" fill="#8ab0e0"
        font-family="'Helvetica Neue',Arial,sans-serif">strade · Uomini</text>

  <!-- Lato destro: Donne (leggero, sale) -->
  <line x1="1122" y1="322" x2="1122" y2="372" stroke="#7a9ab8" stroke-width="2"/>
  <line x1="1092" y1="372" x2="1152" y2="372" stroke="#7a9ab8" stroke-width="2"/>
  <line x1="1092" y1="372" x2="1092" y2="422" stroke="#7a9ab8" stroke-width="1.5"/>
  <line x1="1152" y1="372" x2="1152" y2="422" stroke="#7a9ab8" stroke-width="1.5"/>
  <!-- Piatto destro (F) -->
  <rect x="1072" y="422" width="104" height="65" rx="9"
        fill="#8b1a4a" stroke="#c45c82" stroke-width="1.5"/>
  <text x="1122" y="452" text-anchor="middle" font-size="24" font-weight="bold"
        fill="#ffffff" font-family="'Helvetica Neue',Arial,sans-serif">66</text>
  <text x="1122" y="471" text-anchor="middle" font-size="11" fill="#f0b0cc"
        font-family="'Helvetica Neue',Arial,sans-serif">strade · Donne</text>

  <!-- Rapporto sotto la bilancia -->
  <text x="940" y="590" text-anchor="middle" font-size="17" fill="#4a6a80"
        font-family="'Helvetica Neue',Arial,sans-serif" letter-spacing="3">rapporto  16 : 1</text>

</svg>
